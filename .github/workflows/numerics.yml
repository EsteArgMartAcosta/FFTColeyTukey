name: Independent Python numerical checks
on:
  push:
    branches: [main]
    paths: ['experiments/**', '.github/workflows/numerics.yml']
  pull_request:
    paths: ['experiments/**', '.github/workflows/numerics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements.txt
      - run: pip install -r experiments/requirements.txt
      - run: python -m pytest experiments/tests -q
